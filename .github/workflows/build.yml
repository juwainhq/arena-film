name: Build Desktop Apps
on:
  push:
    branches: ['main']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are unsigned; skip certificate discovery so electron-builder
      # never fails looking for a signing identity that CI does not have.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-${{ matrix.os }}
          path: dist-electron/

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run web:stage
      - run: npx cap sync android
      - run: ./android/gradlew assembleDebug -p android
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Film Lab ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Film Lab installers for every platform:

            - **Windows:** download the `.exe` installer
            - **Mac:** download the `.dmg` disk image
            - **Linux:** download the `.AppImage`
            - **Android:** download the `.apk` package
          # Only the installers: `artifacts/*/*` skips the unpacked builds
          # (e.g. `win-unpacked/Film Lab.exe`) that electron-builder leaves behind.
          files: |
            artifacts/*/*.exe
            artifacts/*/*.dmg
            artifacts/*/*.AppImage
            artifacts/*/*.apk
      - name: Reset rolling latest-build release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-build --cleanup-tag --yes || true
      - name: Publish rolling latest-build release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          name: latest-build
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          body: |
            Rolling Film Lab build from `main` for every platform:

            - **Windows:** download the `.exe` installer
            - **Mac:** download the `.dmg` disk image
            - **Linux:** download the `.AppImage`
            - **Android:** download the `.apk` package
          files: |
            artifacts/*/*.exe
            artifacts/*/*.dmg
            artifacts/*/*.AppImage
            artifacts/*/*.apk
