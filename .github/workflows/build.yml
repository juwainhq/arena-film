name: Build Desktop Apps
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are unsigned; skip certificate discovery so electron-builder
      # never fails looking for a signing identity that CI does not have.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-${{ matrix.os }}
          path: dist-electron/

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          name: Film Lab v${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Film Lab installers for every platform:

            - **Windows:** download the `.exe` installer
            - **Mac:** download the `.dmg` disk image
            - **Linux:** download the `.AppImage`
          # Only the installers: `artifacts/*/*` skips the unpacked builds
          # (e.g. `win-unpacked/Film Lab.exe`) that electron-builder leaves behind.
          files: |
            artifacts/*/*.exe
            artifacts/*/*.dmg
            artifacts/*/*.AppImage
